<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="nav-wrap">
            <a class="logo" href="#">SpaceX</a>

            <nav class="main-nav">
                <a href="#projects">航天项目</a>
                <a href="#about">关于</a>
            </nav>
        </div>
    </header>

    <main>

        <section>
            <h1>SpaceX</h1>
            <p>探索太空，连接未来</p>
        </section>

        <section id="projects">
            <h2>航天项目</h2>

            <div class="card-grid">

                <article class="card">
                    <h3>Falcon 9</h3>
                    <p>SpaceX 的轨道级运载火箭。</p>
                    <a href="#">查看详情</a>
                </article>

                <article class="card">
                    <h3>Falcon Heavy</h3>
                    <p>由三枚 Falcon 9 核心组成的重型运载火箭。</p>
                    <a href="#">查看详情</a>
                </article>

                <article class="card">
                    <h3>Starship</h3>
                    <p>用于深空探索的大型可重复使用航天器。</p>
                    <a href="#">查看详情</a>
                </article>

                <article class="card">
                    <h3>Dragon</h3>
                    <p>用于运输人员和货物的载人航天飞船。</p>
                    <a href="#">查看详情</a>
                </article>

                <article class="card">
                    <h3>Starlink</h3>
                    <p>SpaceX 建设的全球卫星互联网系统。</p>
                    <a href="#">查看详情</a>
                </article>

                <article class="card">
                    <h3>NASA Missions</h3>
                    <p>SpaceX 与 NASA 合作开展的航天任务。</p>
                    <a href="#">查看详情</a>
                </article>

            </div>
        </section>

    </main>

    <footer id="about">
        <p>SpaceX专题页面 · 响应式网页练习</p>
    </footer>

</body>
</html>
